<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bukmark</title>
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body class="popup">
    <div id="loginForm" class="stack" hidden>
      <label for="serverInput">Server</label>
      <input id="serverInput" placeholder="http://localhost:3000" spellcheck="false" autocomplete="off" />
      <button id="loginButton" type="button" class="primary">Log in</button>
      <button id="showToken" type="button" class="link">Use an access token instead</button>
      <div id="tokenForm" class="stack" hidden>
        <label for="tokenInput">Access token</label>
        <input id="tokenInput" type="password" placeholder="bkm_…" spellcheck="false" autocomplete="off" />
        <p class="muted">Create one in the web app under Settings › Access tokens.</p>
        <button id="useToken" type="button" class="secondary">Use token</button>
      </div>
      <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
      <p class="disclosure">Saving a page sends its address and title to this server, and nowhere else. Opening this popup on a page sends its address there too, to show whether it is already saved.</p>
    </div>

    <div id="saveForm" class="stack" hidden>
      <p id="known" class="known" role="status" hidden></p>
      <label for="title">Title</label>
      <input id="title" />
      <label for="note">Why keep it?</label>
      <textarea id="note" placeholder="optional — what your assistant sorts on later"></textarea>
      <label for="hub">Hub</label>
      <select id="hub"><option value="">(unsorted)</option></select>
      <button id="save" type="button" class="primary">Save</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
